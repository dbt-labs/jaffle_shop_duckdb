name: Cross-Domain Break Predictor (test)

on:
  pull_request:
    branches: [duckdb]

permissions:
  pull-requests: write

jobs:
  test-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post test comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Cross-Domain Break Predictor is wired up and running.'
            })
