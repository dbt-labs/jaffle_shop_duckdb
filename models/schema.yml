version: 2

models:
  - name: customers
    description: This table has basic information about a customer, as well as some derived facts based on a customer's orders

    columns:
      - name: customer_id
        description: This is a unique identifier for a customer
        tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name. PII.

      - name: last_name
        description: Customer's last name. PII.

      - name: first_order
        description: Date (UTC) of a customer's first order

      - name: most_recent_order
        description: Date (UTC) of a customer's most recent order

      - name: number_of_orders
        description: Count of the number of orders a customer has placed

      - name: total_order_amount
        description: Total value (AUD) of a customer's orders

  - name: orders
    description: This table has basic information about orders, as well as some derived facts based on payments

    columns:
      - name: order_id
        tests:
          - unique
          - not_null
        description: This is a unique identifier for an order

      - name: customer_id
        description: Foreign key to the customers table
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('customers')
                field: customer_id

      - name: order_date
        description: Date (UTC) that the order was placed

      - name: status
        description: '{{ doc("orders_status") }}'
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

      - name: amount
        description: Total amount (AUD) of the order
        tests:
          - not_null

      - name: credit_card_amount
        description: Amount of the order (AUD) paid for by credit card
        tests:
          - not_null

      - name: coupon_amount
        description: Amount of the order (AUD) paid for by coupon
        tests:
          - not_null

      - name: bank_transfer_amount
        description: Amount of the order (AUD) paid for by bank transfer
        tests:
          - not_null

      - name: gift_card_amount
        description: Amount of the order (AUD) paid for by gift card
        tests:
          - not_null

  - name: customer_order_payment_analysis
    description: >
      A complex analytical model that joins customers, orders, and payments.
      Demonstrates window functions (running totals, rank, lag), conditional
      aggregation with payment-method pivoting, cohort month derivation,
      customer tenure, and average order value comparisons.
    columns:
      - name: customer_id
        description: This is a unique identifier for a customer
        tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name. PII.

      - name: last_name
        description: Customer's last name. PII.

      - name: first_order_date
        description: Date (UTC) of a customer's first order

      - name: most_recent_order_date
        description: Date (UTC) of a customer's most recent order

      - name: number_of_orders
        description: Count of the number of orders a customer has placed

      - name: customer_tenure_days
        description: Number of days between a customer's first and most recent order

      - name: average_order_value
        description: Average order value (AUD) across the customer's orders

      - name: customer_lifetime_value
        description: Total value (AUD) of all of a customer's orders

      - name: cohort_month
        description: The month (YYYY-MM) in which the customer placed their first order

      - name: credit_card_total
        description: Total amount (AUD) the customer paid with a credit card

      - name: coupon_total
        description: Total amount (AUD) the customer paid with a coupon

      - name: bank_transfer_total
        description: Total amount (AUD) the customer paid via bank transfer

      - name: gift_card_total
        description: Total amount (AUD) the customer paid with a gift card

      - name: total_paid
        description: Total amount (AUD) the customer has paid across all orders
