version: 2

models:
  - name: customers
    description: This table has basic information about a customer, as well as some derived facts based on a customer's orders

    columns:
      - name: customer_id
        description: This is a unique identifier for a customer
        tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name. PII.

      - name: last_name
        description: Customer's last name. PII.

      - name: first_order
        description: Date (UTC) of a customer's first order

      - name: most_recent_order
        description: Date (UTC) of a customer's most recent order

      - name: number_of_orders
        description: Count of the number of orders a customer has placed

      - name: customer_lifetime_value
        description: Total value (AUD) of all customer orders including returns

      - name: clv_net_returns
        description: Total value (AUD) of customer orders excluding returned and return_pending orders. Use this for accurate customer valuation.
        tests:
          - not_null

      - name: days_since_last_order
        description: Number of days since the customer's most recent order. Used for recency analysis.

  - name: customer_segments
    description: This table categorizes customers based on their ordering behavior, value, and recency. Uses net CLV (excluding returns) and dynamic percentile-based thresholds.

    columns:
      - name: customer_id
        description: This is a unique identifier for a customer.
        tests:
          - unique
          - not_null

      - name: number_of_orders
        description: Count of the number of orders a customer has placed.

      - name: customer_lifetime_value
        description: Total value (AUD) of all orders including returns. Kept for backward compatibility.

      - name: clv_net_returns
        description: Total value (AUD) excluding returned and return_pending orders. Primary metric for segmentation.

      - name: days_since_last_order
        description: Number of days since the customer's most recent order.

      - name: order_frequency_segment
        description: Categorization based on order frequency (Frequent Buyer, Occasional Buyer, Rare Buyer).

      - name: value_segment
        description: Categorization based on net CLV using dynamic percentile thresholds (top 25% = High Value, 25-50% = Medium Value).
        tests:
          - accepted_values:
              values: ['High Value', 'Medium Value', 'Low Value']

      - name: recency_segment
        description: Categorization based on days since last order (Active ≤30d, Recent ≤90d, Lapsing ≤180d, Dormant >180d).
        tests:
          - accepted_values:
              values: ['Active', 'Recent', 'Lapsing', 'Dormant', 'Never Ordered']

      - name: marketing_segment
        description: Combined value and recency segment for targeted marketing (e.g., VIP Active, VIP At-Risk, Growth Lost).
        tests:
          - accepted_values:
              values: ['VIP Active', 'VIP At-Risk', 'VIP Lost', 'Growth Active', 'Growth At-Risk', 'Growth Lost', 'Nurture Active', 'Nurture At-Risk', 'Nurture Lost', 'New/Unknown']

  - name: customer_order_pattern
    description: This table provides detailed insights into the ordering patterns of customers, including the frequency and recency of their orders.
    
    columns:
      - name: customer_id
        description: This is a unique identifier for a customer.
        tests:
          - unique
          - not_null
    
      - name: first_order
        description: Date (UTC) of a customer's first order.
    
      - name: most_recent_order
        description: Date (UTC) of a customer's most recent order.
    
      - name: number_of_orders
        description: Count of the number of orders a customer has placed.
    
      - name: days_active
        description: The total number of days between a customer's first and most recent orders.
    
      - name: avg_days_between_orders
        description: Average number of days between consecutive orders for a customer.

  - name: orders
    description: This table has basic information about orders, as well as some derived facts based on payments

    columns:
      - name: order_id
        tests:
          - unique
          - not_null
        description: This is a unique identifier for an order

      - name: customer_id
        description: Foreign key to the customers table
        tests:
          - not_null
          - relationships:
              to: ref('customers')
              field: customer_id

      - name: order_date
        description: Date (UTC) that the order was placed

      - name: status
        description: '{{ doc("orders_status") }}'
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

      - name: amount
        description: Total amount (AUD) of the order
        tests:
          - not_null

      - name: credit_card_amount
        description: Amount of the order (AUD) paid for by credit card
        tests:
          - not_null

      - name: coupon_amount
        description: Amount of the order (AUD) paid for by coupon
        tests:
          - not_null

      - name: bank_transfer_amount
        description: Amount of the order (AUD) paid for by bank transfer
        tests:
          - not_null

      - name: gift_card_amount
        description: Amount of the order (AUD) paid for by gift card
        tests:
          - not_null
