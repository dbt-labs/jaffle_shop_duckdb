name: Cross-Domain Break Predictor

on:
  pull_request:
    branches: [duckdb]

permissions:
  pull-requests: write

jobs:
  break-predictor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fastmcp mcp-server-datahub requests

      - name: Run break predictor
        env:
          DATAHUB_GMS_URL: "http://<YOUR-AWS-PUBLIC-IP>:8080"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/break_predictor.py
